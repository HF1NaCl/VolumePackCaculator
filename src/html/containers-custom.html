<div
  class="card col-12 col-md-5 mx-auto border rounded shadow-sm p-0"
  style="padding: 20px; background-color: rgba(220, 220, 220, 0.247); margin-top: 40px"
>
  <div class="card-header d-flex justify-content-bewtween aligh-items-center">
    <h3><strong>Agregar Cajas</strong></h3>
  </div>
  <div class="card-body p-2">
    <div class="d-flex flex-column mb-3 justify-content-center">
      <!--Agregar Caja-->
      <h4>Caja:</h4>
      <div class="input-group mt-2 mb-3">
        <div class="input-group-prepend">
          <span class="input-group-text">W, H, D</span>
        </div>
        <input
          id="widthInputCustomBox"
          min="1"
          type="number"
          aria-label="Width"
          class="form-control positive"
          placeholder="Anchura"
        />
        <input
          id="heightInputCustomBox"
          min="1"
          type="number"
          aria-label="Height"
          class="form-control positive"
          placeholder="Altura"
        />
        <input
          id="depthInputCustomBox"
          min="1"
          type="number"
          aria-label="Depth"
          class="form-control positive"
          placeholder="Profundidad"
        />
        <div class="input-group-append">
          <span class="input-group-text">m</span>
        </div>
      </div>
      <div class="text-center">
        <button id="addCustomBox" type="button" class="btn btn-primary">Agregar Caja</button>
      </div>
      <p class="text-center text-muted mt-3 mb-0">
        Volumen disponible:
        <strong id="customAvailableVolume">...</strong> m³
      </p>
      <hr />
      <!--Cajas Agregadas-->
      <h4>
        Cajas agregadas:
        <small class="text-muted">
          <span id="customBoxCount">0</span>/<span id="customBoxLimit"></span>
        </small>
      </h4>
      <div id="customBoxes" class="d-flex flex-wrap gap-2"></div>
    </div>
  </div>
</div>
<div
  class="card col-12 col-md-5 mx-auto border rounded shadow-sm p-0"
  style="background-color: rgba(220, 220, 220, 0.247); margin-top: 40px; overflow: hidden"
>
  <div class="card-header d-flex justify-content-between align-items-center">
    <h3><strong>Vista Isométrica</strong></h3>
  </div>
  <div class="card-body p-2">
    <div id="isometric-content-containers"></div>
  </div>
</div>
